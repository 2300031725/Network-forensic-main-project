version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: security_analytics_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-Runvisha@2005}
      MYSQL_DATABASE: ${DB_NAME:-skillpalavar_db}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: security_analytics_backend
    restart: always
    network_mode: "host"
    privileged: true
    environment:
      - DB_HOST=127.0.0.1
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-Runvisha@2005}
      - DB_NAME=${DB_NAME:-skillpalavar_db}
    depends_on:
      - db

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: security_analytics_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db_data:
